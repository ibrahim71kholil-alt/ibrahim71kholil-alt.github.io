<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rupelia Elegance | Exclusive Jewelry</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 flex flex-col min-h-screen">

  <!-- Header -->
  <header class="bg-white sticky top-0 z-40 border-b shadow-sm">
    <div class="max-w-6xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-3">
      <a href="index.html" class="text-2xl md:text-3xl font-serif font-bold text-pink-600 tracking-tight">RUPELIA</a>
      
      <div class="order-3 md:order-2 w-full md:w-80 relative">
        <input type="text" id="searchInput" placeholder="Search your dream jewelry..." class="w-full pl-10 pr-4 py-2 border rounded-full text-sm bg-gray-50 focus:bg-white outline-none focus:ring-2 focus:ring-pink-500">
        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-gray-400 text-sm"></i>
      </div>

      <div class="order-2 md:order-3 flex items-center gap-2">
        <button id="langToggleBtn" onclick="toggleLanguage()" class="text-xs md:text-sm font-bold bg-gray-100 hover:bg-gray-200 px-3 py-2 rounded-full border">
          <i class="fa-solid fa-globe text-pink-600 mr-1"></i><span id="langBtnText">বাংলা</span>
        </button>
        <a href="https://wa.me/8801619626988" target="_blank" class="bg-green-600 text-white px-3.5 py-2 rounded-full text-xs md:text-sm font-bold flex items-center gap-1.5 hover:bg-green-700 transition shadow-sm">
          <i class="fab fa-whatsapp text-sm"></i> <span id="waBtn">Support</span>
        </a>
      </div>
    </div>
  </header>

  <!-- Hero Section -->
  <section class="bg-gradient-to-r from-pink-500 to-rose-400 text-white py-12 px-4 text-center">
    <h2 id="heroTitle" class="text-3xl md:text-4xl font-serif font-bold mb-2">Elegance Redefined</h2>
    <p id="heroSubtitle" class="text-pink-100 max-w-xl mx-auto text-xs md:text-sm">Adorn yourself with our timeless collection of handcrafted bangles and exquisite jewelry, curated just for you.</p>
  </section>

  <!-- Products Grid -->
  <main class="max-w-6xl mx-auto px-4 py-10 flex-1 w-full">
    <div class="flex justify-between items-center mb-6">
      <h3 id="sectionTitle" class="text-xl md:text-2xl font-bold text-gray-800">Our Collection</h3>
      <span id="productCount" class="text-xs text-gray-500 bg-gray-200 px-2.5 py-1 rounded-full font-medium"></span>
    </div>
    <div id="productGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-6"></div>
  </main>

  <!-- প্রোডাক্ট ইমেজ গ্যালারি মডাল -->
  <div id="galleryModal" class="fixed inset-0 bg-black bg-opacity-80 z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-lg w-full p-4 relative overflow-hidden flex flex-col max-h-[90vh]">
      <button onclick="closeGallery()" class="absolute top-3 right-3 text-gray-600 hover:text-black text-xl font-bold z-10 w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center">
        ✕
      </button>

      <!-- মেইন ইমেজ -->
      <div class="w-full h-64 md:h-80 bg-gray-100 rounded-xl overflow-hidden mb-3 flex items-center justify-center">
        <img id="modalMainImg" src="" class="w-full h-full object-contain">
      </div>

      <!-- থাম্বনেইল স্ট্রিপ -->
      <div id="modalThumbnails" class="flex gap-2 overflow-x-auto pb-2 mb-3"></div>

      <!-- ডিটেইলস ও অর্ডার বাটন -->
      <div class="border-t pt-3 flex justify-between items-center">
        <div>
          <h4 id="modalTitle" class="font-bold text-sm md:text-base text-gray-800 truncate"></h4>
          <div id="modalPrice" class="text-pink-600 font-extrabold text-lg"></div>
        </div>
        <a id="modalOrderBtn" href="#" target="_blank" class="bg-pink-600 hover:bg-pink-700 text-white font-bold px-4 py-2 rounded-xl text-xs flex items-center gap-1">
          <i class="fab fa-whatsapp"></i> <span id="modalOrderText">Order Now</span>
        </a>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="bg-white border-t py-6 text-center text-xs text-gray-500">
    <p>© 2026 RUPELIA. All rights reserved.</p>
  </footer>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCswBk5Hrkzmb4c26DiDKYWzw168bo6Ijo",
      authDomain: "if-ibrahim.firebaseapp.com",
      databaseURL: "https://if-ibrahim-default-rtdb.firebaseio.com",
      projectId: "if-ibrahim",
      storageBucket: "if-ibrahim.firebasestorage.app",
      messagingSenderId: "233373846462",
      appId: "1:233373846462:web:86179f05bddd8356ca47ef"
    };

    firebase.initializeApp(firebaseConfig);
    const productsRef = firebase.database().ref('products');

    let allProducts = [];
    let currentLang = 'en';

    const trans = {
      en: {
        heroTitle: "Elegance Redefined",
        heroSubtitle: "Adorn yourself with our timeless collection of handcrafted bangles and exquisite jewelry.",
        sectionTitle: "Our Collection",
        orderBtn: "Order",
        waBtn: "Support",
        langBtn: "বাংলা",
        photosBadge: "Photos"
      },
      bn: {
        heroTitle: "রূপের আভিজাত্যে রূপেলিয়া",
        heroSubtitle: "ঐতিহ্য আর আধুনিকতার মেলবন্ধনে সাজিয়ে তুলুন নিজেকে, আমাদের এক্সক্লুসিভ কালেকশনে।",
        sectionTitle: "আমাদের কালেকশন",
        orderBtn: "অর্ডার করুন",
        waBtn: "সাহায্য",
        langBtn: "English",
        photosBadge: "ছবি"
      }
    };

    function toggleLanguage() {
      currentLang = currentLang === 'en' ? 'bn' : 'en';
      updateUI();
    }

    function updateUI() {
      document.getElementById('heroTitle').innerText = trans[currentLang].heroTitle;
      document.getElementById('heroSubtitle').innerText = trans[currentLang].heroSubtitle;
      document.getElementById('sectionTitle').innerText = trans[currentLang].sectionTitle;
      document.getElementById('waBtn').innerText = trans[currentLang].waBtn;
      document.getElementById('langBtnText').innerText = trans[currentLang].langBtn;
      render(getFiltered());
    }

    productsRef.on('value', (snap) => {
      allProducts = [];
      const data = snap.val();
      if (data) {
        Object.keys(data).forEach(id => allProducts.push({ id, ...data[id] }));
      }
      render(getFiltered());
    });

    function getFiltered() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      if (!q) return allProducts;
      return allProducts.filter(p => (p.title || "").toLowerCase().includes(q) || (p.description || "").toLowerCase().includes(q));
    }

    document.getElementById('searchInput').addEventListener('input', () => render(getFiltered()));

    function render(products) {
      const grid = document.getElementById('productGrid');
      const countBadge = document.getElementById('productCount');
      countBadge.textContent = `${products.length} Items`;
      grid.innerHTML = '';

      if (products.length === 0) {
        grid.innerHTML = '<p class="col-span-full text-center text-gray-500 py-10">কোনো প্রোডাক্ট পাওয়া যায়নি।</p>';
        return;
      }

      products.forEach(p => {
        const disc = parseInt(p.discount || 0);
        const newPrice = disc > 0 ? Math.round(p.price - (p.price * disc / 100)) : p.price;
        const imgList = p.images || (p.image ? [p.image] : ['https://via.placeholder.com/300']);
        const coverImg = imgList[0];

        const waLink = `https://wa.me/8801619626988?text=${encodeURIComponent(`Hello, I want to order:\nProduct: ${p.title}\nPrice: ৳${newPrice}\nDetails: ${p.description || ''}`)}`;

        const card = document.createElement('div');
        card.className = "bg-white rounded-2xl shadow-sm border overflow-hidden hover:shadow-md transition flex flex-col justify-between";
        card.innerHTML = `
          <div>
            <div class="relative cursor-pointer group" onclick="openGallery('${p.id}')">
              ${disc > 0 ? `<div class="absolute top-2 left-2 bg-red-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-md z-10">${disc}% OFF</div>` : ''}
              <img src="${coverImg}" class="w-full h-44 object-cover group-hover:scale-105 transition duration-300" onerror="this.src='https://via.placeholder.com/300'">
              ${imgList.length > 1 ? `<div class="absolute bottom-2 right-2 bg-black bg-opacity-70 text-white text-[10px] px-2 py-0.5 rounded-full font-bold flex items-center gap-1"><i class="fa-solid fa-images"></i> ${imgList.length} ${trans[currentLang].photosBadge}</div>` : ''}
            </div>
            <div class="p-3">
              <h3 class="font-bold text-gray-800 text-sm truncate cursor-pointer hover:text-pink-600" onclick="openGallery('${p.id}')">${p.title}</h3>
              <p class="text-xs text-gray-500 mt-1 line-clamp-2">${p.description || ''}</p>
            </div>
          </div>
          <div class="p-3 border-t bg-gray-50 flex items-center justify-between">
            <div>
              ${disc > 0 ? `<span class="text-gray-400 line-through text-[10px] block">৳${p.price}</span>` : ''}
              <span class="text-pink-600 font-extrabold text-sm md:text-base">৳${newPrice}</span>
            </div>
            <a href="${waLink}" target="_blank" class="bg-pink-600 hover:bg-pink-700 text-white text-xs font-semibold px-3 py-1.5 rounded-lg transition">
              ${trans[currentLang].orderBtn}
            </a>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // গ্যালারি ভিউয়ার ফাংশন
    window.openGallery = function(productId) {
      const product = allProducts.find(p => p.id === productId);
      if (!product) return;

      const imgList = product.images || (product.image ? [product.image] : ['https://via.placeholder.com/300']);
      const disc = parseInt(product.discount || 0);
      const newPrice = disc > 0 ? Math.round(product.price - (product.price * disc / 100)) : product.price;

      document.getElementById('modalTitle').textContent = product.title;
      document.getElementById('modalPrice').textContent = `৳${newPrice}`;
      document.getElementById('modalOrderBtn').href = `https://wa.me/8801619626988?text=${encodeURIComponent(`Hello, I want to order:\nProduct: ${product.title}\nPrice: ৳${newPrice}\nDetails: ${product.description || ''}`)}`;
      
      const mainImg = document.getElementById('modalMainImg');
      mainImg.src = imgList[0];

      const thumbContainer = document.getElementById('modalThumbnails');
      thumbContainer.innerHTML = '';

      imgList.forEach((url, index) => {
        const thumb = document.createElement('img');
        thumb.src = url;
        thumb.className = `w-14 h-14 object-cover rounded-lg border-2 cursor-pointer flex-shrink-0 ${index === 0 ? 'border-pink-600' : 'border-transparent'}`;
        thumb.onclick = () => {
          mainImg.src = url;
          document.querySelectorAll('#modalThumbnails img').forEach(el => el.classList.remove('border-pink-600'));
          thumb.classList.add('border-pink-600');
        };
        thumbContainer.appendChild(thumb);
      });

      document.getElementById('galleryModal').classList.remove('hidden');
    };

    window.closeGallery = function() {
      document.getElementById('galleryModal').classList.add('hidden');
    };
  </script>
</body>
</html>
