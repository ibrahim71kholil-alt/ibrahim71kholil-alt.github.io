<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rupelia Elegance | Exclusive Jewelry</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
</head>
<body class="bg-gray-50 text-gray-900">

  <!-- Header -->
  <header class="bg-white sticky top-0 z-50 border-b">
    <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
      <h1 class="text-3xl font-serif font-bold text-pink-600 tracking-tight">RUPELIA</h1>
      <div class="flex gap-4">
        <button id="langToggleBtn" onclick="toggleLanguage()" class="text-sm font-bold bg-gray-100 px-4 py-2 rounded-full border">বাংলা / EN</button>
        <a href="https://wa.me/8801619626988" target="_blank" class="bg-green-600 text-white px-4 py-2 rounded-full text-sm font-bold flex items-center gap-2">
          <i class="fab fa-whatsapp"></i> <span id="waBtn">Support</span>
        </a>
      </div>
    </div>
  </header>

  <!-- Hero Section -->
  <section class="bg-pink-50 py-16 px-4 text-center">
    <h2 id="heroTitle" class="text-4xl font-serif font-bold text-gray-800 mb-4">Elegance Redefined</h2>
    <p id="heroSubtitle" class="text-gray-600 max-w-xl mx-auto text-lg">Adorn yourself with our timeless collection of handcrafted bangles and exquisite jewelry, curated just for you.</p>
  </section>

  <!-- Search & Filter -->
  <div class="max-w-6xl mx-auto px-4 -mt-8">
    <div class="relative">
      <input type="text" id="searchInput" placeholder="Search your dream jewelry..." class="w-full p-4 pl-12 rounded-2xl shadow-lg border-0 focus:ring-2 focus:ring-pink-500 outline-none">
      <i class="fa fa-search absolute left-4 top-5 text-gray-400"></i>
    </div>
  </div>

  <!-- Products Grid -->
  <main class="max-w-6xl mx-auto px-4 py-12">
    <div id="productGrid" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>
  </main>

  <script>
    const firebaseConfig = { apiKey: "AIzaSyCswBk5Hrkzmb4c26DiDKYWzw168bo6Ijo", authDomain: "if-ibrahim.firebaseapp.com", databaseURL: "https://if-ibrahim-default-rtdb.firebaseio.com", projectId: "if-ibrahim", storageBucket: "if-ibrahim.firebasestorage.app", messagingSenderId: "233373846462", appId: "1:233373846462:web:86179f05bddd8356ca47ef" };
    firebase.initializeApp(firebaseConfig);
    const productsRef = firebase.database().ref('products');
    
    let allProducts = [];
    let currentLang = 'en';

    const trans = {
      en: { heroTitle: "Elegance Redefined", heroSubtitle: "Adorn yourself with our timeless collection of handcrafted bangles and exquisite jewelry.", orderBtn: "Order Now", waBtn: "Support" },
      bn: { heroTitle: "রূপের আভিজাত্যে রূপেলিয়া", heroSubtitle: "ঐতিহ্য আর আধুনিকতার মেলবন্ধনে সাজিয়ে তুলুন নিজেকে, আমাদের এক্সক্লুসিভ কালেকশনে।", orderBtn: "অর্ডার করুন", waBtn: "সাহায্য" }
    };

    function toggleLanguage() { currentLang = currentLang === 'en' ? 'bn' : 'en'; updateUI(); }
    function updateUI() {
      document.getElementById('heroTitle').innerText = trans[currentLang].heroTitle;
      document.getElementById('heroSubtitle').innerText = trans[currentLang].heroSubtitle;
      document.getElementById('waBtn').innerText = trans[currentLang].waBtn;
      render(allProducts);
    }

    productsRef.on('value', (snap) => {
      allProducts = [];
      snap.forEach(s => allProducts.push({ id: s.key, ...s.val() }));
      render(allProducts);
    });

    document.getElementById('searchInput').addEventListener('input', (e) => {
      const filtered = allProducts.filter(p => p.title.toLowerCase().includes(e.target.value.toLowerCase()));
      render(filtered);
    });

    function render(products) {
      const grid = document.getElementById('productGrid');
      grid.innerHTML = '';
      products.forEach(p => {
        const disc = parseInt(p.discount || 0);
        const newPrice = disc > 0 ? (p.price - (p.price * disc / 100)) : p.price;
        const waLink = `https://wa.me/8801619626988?text=Product:%20${encodeURIComponent(p.title)}%0APrice:%20৳${newPrice}%0ADescription:%20${encodeURIComponent(p.description)}`;
        
        grid.innerHTML += `
          <div class="bg-white rounded-2xl shadow-sm border p-4 hover:shadow-xl transition relative">
            ${disc > 0 ? `<div class="absolute top-4 left-4 bg-red-500 text-white text-xs font-bold px-2 py-1 rounded-lg">${disc}% OFF</div>` : ''}
            <img src="${p.image}" class="w-full h-48 object-cover rounded-xl mb-4">
            <h3 class="font-bold text-lg mb-1">${p.title}</h3>
            <p class="text-sm text-gray-500 mb-3 h-10 overflow-hidden">${p.description}</p>
            <div class="flex items-center justify-between">
              <div>
                ${disc > 0 ? `<span class="text-gray-400 line-through text-xs">৳${p.price}</span>` : ''}
                <div class="text-xl font-bold text-pink-600">৳${newPrice}</div>
              </div>
              <a href="${waLink}" target="_blank" class="bg-pink-600 text-white px-4 py-2 rounded-xl text-sm font-bold hover:bg-pink-700">${trans[currentLang].orderBtn}</a>
            </div>
          </div>`;
      });
    }
  </script>
</body>
</html>
