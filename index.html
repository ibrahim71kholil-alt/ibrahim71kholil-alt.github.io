<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RUPELIA - এক্সক্লুসিভ কালেকশন</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
</head>
<body class="bg-gray-50 text-gray-800">

  <!-- নেভিগেশন বার -->
  <header class="bg-white shadow-sm sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
      <a href="#" class="text-2xl font-extrabold tracking-wider text-pink-600">RUPELIA</a>
      <a href="https://wa.me/8801700000000" target="_blank" class="bg-pink-600 text-white text-xs md:text-sm font-semibold px-4 py-2 rounded-full hover:bg-pink-700">
        WhatsApp অর্ডার
      </a>
    </div>
  </header>

  <!-- ব্যানার -->
  <div class="bg-gradient-to-r from-pink-500 to-rose-400 text-white py-12 px-4 text-center">
    <h1 class="text-3xl md:text-4xl font-bold mb-2">মেয়েদের প্রিমিয়াম চুড়ি ও জুয়েলারি কালেকশন</h1>
    <p class="text-pink-100 text-sm md:text-base">সেরা ডিজাইনের চুড়ি পেয়ে যাবেন সরাসরি আমাদের কাছ থেকে</p>
  </div>

  <!-- প্রোডাক্ট গ্রিড -->
  <main class="max-w-6xl mx-auto px-4 py-10">
    <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">আমাদের প্রোডাক্টসমূহ</h2>
    
    <div id="productGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-6">
      <p class="col-span-full text-center text-gray-500">প্রোডাক্ট লোড হচ্ছে...</p>
    </div>
  </main>

  <footer class="bg-white border-t mt-12 py-6 text-center text-xs text-gray-500">
    © 2026 RUPELIA. All rights reserved.
  </footer>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCswBk5Hrkzmb4c26DiDKYWzw168bo6Ijo",
      authDomain: "if-ibrahim.firebaseapp.com",
      databaseURL: "https://if-ibrahim-default-rtdb.firebaseio.com",
      projectId: "if-ibrahim",
      storageBucket: "if-ibrahim.firebasestorage.app",
      messagingSenderId: "233373846462",
      appId: "1:233373846462:web:86179f05bddd8356ca47ef"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const productsRef = db.ref('products');

    productsRef.on('value', (snapshot) => {
      const grid = document.getElementById('productGrid');
      grid.innerHTML = '';
      const data = snapshot.val();

      if (!data) {
        grid.innerHTML = '<p class="col-span-full text-center text-gray-500">কোনো প্রোডাক্ট পাওয়া যায়নি।</p>';
        return;
      }

      Object.keys(data).forEach((id) => {
        const item = data[id];
        const card = document.createElement('div');
        card.className = "bg-white rounded-xl shadow-sm border overflow-hidden hover:shadow-md transition flex flex-col justify-between";
        card.innerHTML = `
          <div>
            <img src="${item.image}" alt="${item.title}" class="w-full h-44 object-cover" onerror="this.src='https://via.placeholder.com/300'">
            <div class="p-3">
              <h3 class="font-bold text-gray-800 text-sm truncate">${item.title}</h3>
              <p class="text-xs text-gray-500 mt-1 line-clamp-2">${item.description || ''}</p>
            </div>
          </div>
          <div class="p-3 border-t bg-gray-50 flex items-center justify-between">
            <span class="text-pink-600 font-bold text-base">৳${item.price}</span>
            <a href="https://wa.me/8801700000000?text=আমি%20${encodeURIComponent(item.title)}%20(৳${item.price})%20অর্ডার%20করতে%20চাই" target="_blank" class="bg-pink-600 hover:bg-pink-700 text-white text-xs font-semibold px-3 py-1.5 rounded-lg transition">
              অর্ডার করুন
            </a>
          </div>
        `;
        grid.appendChild(card);
      });
    });
  </script>
</body>
</html>
