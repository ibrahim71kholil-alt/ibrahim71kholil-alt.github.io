<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rupelia Admin - Product Management</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
</head>
<body class="bg-gray-50 min-h-screen p-4">
  <div class="max-w-3xl mx-auto bg-white p-6 rounded-2xl shadow-lg">
    <h1 class="text-2xl font-bold text-pink-600 mb-6 text-center">Rupelia Admin Dashboard</h1>
    <form id="productForm" class="space-y-4">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <input type="text" id="title" required placeholder="Product Name" class="p-3 border rounded-xl w-full">
        <input type="number" id="price" required placeholder="Regular Price (৳)" class="p-3 border rounded-xl w-full">
        <input type="number" id="discount" placeholder="Discount (%)" class="p-3 border rounded-xl w-full">
        <input type="url" id="image" required placeholder="Image URL" class="p-3 border rounded-xl w-full">
      </div>
      <textarea id="description" required placeholder="Product Description & Details" class="p-3 border rounded-xl w-full h-24"></textarea>
      <button type="submit" class="w-full bg-pink-600 text-white p-3 rounded-xl font-bold text-lg hover:bg-pink-700">Save Product</button>
    </form>
  </div>

  <script>
    const firebaseConfig = { apiKey: "AIzaSyCswBk5Hrkzmb4c26DiDKYWzw168bo6Ijo", authDomain: "if-ibrahim.firebaseapp.com", databaseURL: "https://if-ibrahim-default-rtdb.firebaseio.com", projectId: "if-ibrahim", storageBucket: "if-ibrahim.firebasestorage.app", messagingSenderId: "233373846462", appId: "1:233373846462:web:86179f05bddd8356ca47ef" };
    firebase.initializeApp(firebaseConfig);
    const productsRef = firebase.database().ref('products');

    document.getElementById('productForm').addEventListener('submit', function(e) {
      e.preventDefault();
      productsRef.push({
        title: document.getElementById('title').value,
        price: document.getElementById('price').value,
        discount: document.getElementById('discount').value || 0,
        image: document.getElementById('image').value,
        description: document.getElementById('description').value
      }).then(() => { alert('Product Saved Successfully!'); document.getElementById('productForm').reset(); });
    });
  </script>
</body>
</html>
