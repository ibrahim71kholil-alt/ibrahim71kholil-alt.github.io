<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rupelia Admin - Advanced Pro Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 p-4 md:p-8">

  <!-- সিকিউরিটি স্ক্রিন -->
  <div id="loginScreen" class="fixed inset-0 bg-gray-900 bg-opacity-95 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl p-8 max-w-sm w-full text-center shadow-2xl">
      <div class="w-16 h-16 bg-pink-100 text-pink-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
        <i class="fa-solid fa-lock"></i>
      </div>
      <h2 class="text-2xl font-bold text-gray-800 mb-1">অ্যাডমিন লগইন</h2>
      <p class="text-xs text-gray-500 mb-6">সিকিউরিটি পাসওয়ার্ড দিন</p>
      <form id="loginForm" class="space-y-4">
        <input type="password" id="adminPass" placeholder="পাসওয়ার্ড" required class="w-full px-4 py-3 border rounded-xl focus:ring-2 focus:ring-pink-500 outline-none text-center text-lg">
        <p id="loginError" class="text-red-500 text-xs hidden font-medium">ভুল পাসওয়ার্ড!</p>
        <button type="submit" class="w-full bg-pink-600 hover:bg-pink-700 text-white font-bold py-3 rounded-xl transition">লগইন করুন</button>
      </form>
    </div>
  </div>

  <!-- ড্যাশবোর্ড -->
  <div id="adminDashboard" class="hidden max-w-5xl mx-auto space-y-6">
    
    <div class="flex justify-between items-center bg-white p-5 rounded-2xl shadow-sm border">
      <div>
        <h1 class="text-2xl font-bold text-pink-600">RUPELIA Pro Admin</h1>
        <p class="text-xs text-gray-500">প্রোডাক্ট, ক্যাটাগরি, সাইজ ও স্টক ম্যানেজমেন্ট</p>
      </div>
      <div class="flex items-center gap-2">
        <a href="index.html" target="_blank" class="text-xs bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-2 rounded-lg font-semibold border">শপ দেখুন</a>
        <button onclick="logout()" class="text-xs bg-red-50 hover:bg-red-100 text-red-600 px-3 py-2 rounded-lg font-semibold border border-red-200">লগআউট</button>
      </div>
    </div>

    <!-- প্রোডাক্ট ফর্ম -->
    <div class="bg-white p-6 rounded-2xl shadow-sm border">
      <div class="flex justify-between items-center mb-4 border-b pb-3">
        <h2 id="formHeader" class="text-lg font-bold text-gray-800 flex items-center gap-2">
          <i class="fa-solid fa-plus-circle text-pink-600"></i> নতুন প্রোডাক্ট যুক্ত করুন
        </h2>
        <button id="cancelEditBtn" onclick="resetFormState()" class="hidden text-xs bg-gray-200 hover:bg-gray-300 text-gray-700 px-3 py-1.5 rounded-lg font-bold">
          এডিট বাতিল করুন
        </button>
      </div>

      <form id="productForm" class="space-y-4">
        <input type="hidden" id="editProductId" value="">

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">প্রোডাক্টের নাম *</label>
            <input type="text" id="title" required placeholder="যেমন: রেশমি কাচের চুড়ি" class="w-full p-2.5 border rounded-xl outline-none focus:ring-2 focus:ring-pink-500 text-sm">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">ক্যাটাগরি *</label>
            <select id="category" required class="w-full p-2.5 border rounded-xl outline-none focus:ring-2 focus:ring-pink-500 text-sm bg-white">
              <option value="কাচের চুড়ি">কাচের চুড়ি (Glass Bangles)</option>
              <option value="মেটাল চুড়ি">মেটাল চুড়ি (Metal Bangles)</option>
              <option value="জুয়েলারি সেট">জুয়েলারি সেট (Jewelry Set)</option>
              <option value="ব্রেসলেট">ব্রেসলেট (Bracelets)</option>
              <option value="অন্যান্য">অন্যান্য (Other)</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">মূল দাম (টাকা) *</label>
            <input type="number" id="price" required placeholder="যেমন: 450" class="w-full p-2.5 border rounded-xl outline-none focus:ring-2 focus:ring-pink-500 text-sm">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">ডিসকাউন্ট (%) - অপশনাল</label>
            <input type="number" id="discount" placeholder="যেমন: 15" class="w-full p-2.5 border rounded-xl outline-none focus:ring-2 focus:ring-pink-500 text-sm">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">স্টক স্ট্যাটাস *</label>
            <select id="stock" class="w-full p-2.5 border rounded-xl outline-none focus:ring-2 focus:ring-pink-500 text-sm bg-white">
              <option value="in_stock">In Stock (স্টকে আছে)</option>
              <option value="out_of_stock">Stock Out (স্টক শেষ)</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">সাইজসমূহ (কমা দিয়ে লিখুন)</label>
            <input type="text" id="sizes" placeholder="যেমন: 2.4, 2.6, 2.8" class="w-full p-2.5 border rounded-xl outline-none focus:ring-2 focus:ring-pink-500 text-sm">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">সংক্ষিপ্ত বিবরণ *</label>
            <input type="text" id="description" required placeholder="যেমন: প্রিমিয়াম কাচের রেশমি চুড়ি সেট" class="w-full p-2.5 border rounded-xl outline-none focus:ring-2 focus:ring-pink-500 text-sm">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">
            ছবির সরাসরি লিংক (প্রতি লাইনে ১টি করে URL দিন) *
          </label>
          <textarea id="images" required rows="3" placeholder="https://i.ibb.co/image1.jpg&#10;https://i.ibb.co/image2.jpg" class="w-full p-2.5 border rounded-xl outline-none focus:ring-2 focus:ring-pink-500 text-sm font-mono"></textarea>
        </div>

        <button type="submit" id="saveBtn" class="bg-pink-600 hover:bg-pink-700 text-white font-bold py-3 px-8 rounded-xl transition shadow-md shadow-pink-200">
          প্রোডাক্ট সেভ করুন
        </button>
      </form>
    </div>

    <!-- প্রোডাক্ট লিস্ট -->
    <div class="bg-white p-6 rounded-2xl shadow-sm border">
      <h2 class="text-lg font-bold text-gray-800 mb-4 border-b pb-3 flex items-center gap-2">
        <i class="fa-solid fa-boxes-stacked text-pink-600"></i> বর্তমান প্রোডাক্টসমূহ
      </h2>
      <div id="productList" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <p class="text-gray-400 text-sm">লোড হচ্ছে...</p>
      </div>
    </div>

  </div>

  <script>
    const ADMIN_PASSWORD = "rupelia123";

    if (sessionStorage.getItem('rupelia_admin_auth') === 'true') unlockDashboard();

    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      if (document.getElementById('adminPass').value === ADMIN_PASSWORD) {
        sessionStorage.setItem('rupelia_admin_auth', 'true');
        unlockDashboard();
      } else {
        document.getElementById('loginError').classList.remove('hidden');
      }
    });

    function unlockDashboard() {
      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('adminDashboard').classList.remove('hidden');
    }

    function logout() {
      sessionStorage.removeItem('rupelia_admin_auth');
      location.reload();
    }

    const firebaseConfig = {
      apiKey: "AIzaSyCswBk5Hrkzmb4c26DiDKYWzw168bo6Ijo",
      authDomain: "if-ibrahim.firebaseapp.com",
      databaseURL: "https://if-ibrahim-default-rtdb.firebaseio.com",
      projectId: "if-ibrahim",
      storageBucket: "if-ibrahim.firebasestorage.app",
      messagingSenderId: "233373846462",
      appId: "1:233373846462:web:86179f05bddd8356ca47ef"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const productsRef = db.ref('products');
    let productsDataStore = {};

    document.getElementById('productForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const editId = document.getElementById('editProductId').value;
      const title = document.getElementById('title').value.trim();
      const category = document.getElementById('category').value;
      const price = parseFloat(document.getElementById('price').value);
      const discount = parseInt(document.getElementById('discount').value || 0);
      const stock = document.getElementById('stock').value;
      const sizes = document.getElementById('sizes').value.split(',').map(s => s.trim()).filter(s => s.length > 0);
      const description = document.getElementById('description').value.trim();
      
      const rawImages = document.getElementById('images').value.trim().split('\n');
      const images = rawImages.map(url => url.trim()).filter(url => url.length > 0);

      if (images.length === 0) {
        alert('কমপক্ষে একটি ছবির লিংক দিন!');
        return;
      }

      const productPayload = {
        title,
        category,
        price,
        discount,
        stock,
        sizes,
        description,
        image: images[0],
        images: images,
        updatedAt: Date.now()
      };

      if (editId) {
        productsRef.child(editId).update(productPayload).then(() => {
          alert('প্রোডাক্ট সফলভাবে আপডেট করা হয়েছে!');
          resetFormState();
        });
      } else {
        productPayload.createdAt = Date.now();
        productsRef.push().set(productPayload).then(() => {
          alert('নতুন প্রোডাক্ট যোগ করা হয়েছে!');
          resetFormState();
        });
      }
    });

    productsRef.on('value', (snapshot) => {
      const productList = document.getElementById('productList');
      productList.innerHTML = '';
      productsDataStore = snapshot.val() || {};

      if (!snapshot.exists()) {
        productList.innerHTML = '<p class="text-gray-400 text-sm">কোনো প্রোডাক্ট নেই।</p>';
        return;
      }

      Object.keys(productsDataStore).forEach((id) => {
        const item = productsDataStore[id];
        const imgList = item.images || (item.image ? [item.image] : []);
        const firstImg = imgList[0] || 'https://via.placeholder.com/100';

        const card = document.createElement('div');
        card.className = "border rounded-xl p-3 flex gap-3 items-center bg-gray-50";
        card.innerHTML = `
          <img src="${firstImg}" class="w-16 h-16 object-cover rounded-lg border bg-white" onerror="this.src='https://via.placeholder.com/100'">
          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-1.5">
              <span class="text-[10px] bg-pink-100 text-pink-700 px-1.5 py-0.5 rounded font-bold">${item.category || 'অন্যান্য'}</span>
              ${item.stock === 'out_of_stock' ? '<span class="text-[10px] bg-red-100 text-red-600 px-1.5 py-0.5 rounded font-bold">Stock Out</span>' : '<span class="text-[10px] bg-green-100 text-green-600 px-1.5 py-0.5 rounded font-bold">In Stock</span>'}
            </div>
            <h3 class="font-bold text-gray-800 text-sm truncate mt-1">${item.title}</h3>
            <div class="flex items-center gap-2 mt-0.5">
              <span class="text-xs font-semibold text-pink-600">৳${item.price}</span>
              ${item.discount > 0 ? `<span class="text-[10px] bg-red-100 text-red-600 px-1.5 py-0.5 rounded font-bold">${item.discount}% OFF</span>` : ''}
            </div>
          </div>
          <div class="flex items-center gap-1">
            <button onclick="startEdit('${id}')" class="text-blue-600 hover:bg-blue-100 p-2 rounded-lg text-sm"><i class="fa-solid fa-pen-to-square"></i></button>
            <button onclick="deleteProduct('${id}')" class="text-red-500 hover:bg-red-100 p-2 rounded-lg text-sm"><i class="fa-solid fa-trash-can"></i></button>
          </div>
        `;
        productList.appendChild(card);
      });
    });

    window.startEdit = function(id) {
      const item = productsDataStore[id];
      if (!item) return;

      document.getElementById('editProductId').value = id;
      document.getElementById('title').value = item.title || '';
      document.getElementById('category').value = item.category || 'কাচের চুড়ি';
      document.getElementById('price').value = item.price || '';
      document.getElementById('discount').value = item.discount || '';
      document.getElementById('stock').value = item.stock || 'in_stock';
      document.getElementById('sizes').value = (item.sizes || []).join(', ');
      document.getElementById('description').value = item.description || '';

      const imgList = item.images || (item.image ? [item.image] : []);
      document.getElementById('images').value = imgList.join('\n');

      document.getElementById('formHeader').innerHTML = '<i class="fa-solid fa-pen-to-square text-blue-600"></i> প্রোডাক্ট এডিট করুন';
      document.getElementById('saveBtn').textContent = 'আপডেট সংরক্ষণ করুন';
      document.getElementById('saveBtn').className = 'bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-xl transition';
      document.getElementById('cancelEditBtn').classList.remove('hidden');

      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    window.resetFormState = function() {
      document.getElementById('productForm').reset();
      document.getElementById('editProductId').value = '';
      document.getElementById('formHeader').innerHTML = '<i class="fa-solid fa-plus-circle text-pink-600"></i> নতুন প্রোডাক্ট যুক্ত করুন';
      document.getElementById('saveBtn').textContent = 'প্রোডাক্ট সেভ করুন';
      document.getElementById('saveBtn').className = 'bg-pink-600 hover:bg-pink-700 text-white font-bold py-3 px-8 rounded-xl transition shadow-md shadow-pink-200';
      document.getElementById('cancelEditBtn').classList.add('hidden');
    };

    window.deleteProduct = function(id) {
      if(confirm('আপনি কি নিশ্চিত এই প্রোডাক্টটি মুছে ফেলতে চান?')) {
        productsRef.child(id).remove();
      }
    };
  </script>
</body>
</html>
