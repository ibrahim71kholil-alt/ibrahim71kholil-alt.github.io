<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RUPELIA - অ্যাডমিন প্যানেল</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4 md:p-8">
  <div class="max-w-4xl mx-auto">
    
    <!-- হেডার -->
    <div class="flex justify-between items-center mb-6 bg-white p-4 rounded-xl shadow">
      <div>
        <h1 class="text-2xl font-bold text-pink-600">RUPELIA Admin Panel</h1>
        <p class="text-gray-500 text-sm">নতুন প্রোডাক্ট যোগ ও দাম পরিবর্তন করুন</p>
      </div>
      <a href="index.html" target="_blank" class="bg-gray-800 text-white px-4 py-2 rounded-lg text-sm hover:bg-black">ওয়েবসাইট দেখুন</a>
    </div>

    <!-- প্রোডাক্ট অ্যাড ফরম -->
    <div class="bg-white p-6 rounded-xl shadow mb-8">
      <h2 class="text-lg font-bold text-gray-800 mb-4 border-b pb-2">নতুন প্রোডাক্ট যোগ করুন</h2>
      <form id="productForm" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700">প্রোডাক্টের নাম / চুড়ির নাম</label>
          <input type="text" id="title" required placeholder="যেমন: রেশমি কাচের চুড়ি সেট" class="w-full mt-1 p-2 border rounded-lg focus:ring-2 focus:ring-pink-500 outline-none">
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700">দাম (টাকা)</label>
            <input type="number" id="price" required placeholder="যেমন: 350" class="w-full mt-1 p-2 border rounded-lg focus:ring-2 focus:ring-pink-500 outline-none">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700">ছবির লিংক (Image URL)</label>
            <input type="url" id="image" required placeholder="https://example.com/image.jpg" class="w-full mt-1 p-2 border rounded-lg focus:ring-2 focus:ring-pink-500 outline-none">
          </div>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">বিবরণ / সাইজ ও বিবরণ</label>
          <textarea id="description" rows="2" placeholder="যেমন: প্রিমিয়াম কোয়ালিটি, সাইজ: 2.4, 2.6" class="w-full mt-1 p-2 border rounded-lg focus:ring-2 focus:ring-pink-500 outline-none"></textarea>
        </div>
        <button type="submit" id="submitBtn" class="bg-pink-600 hover:bg-pink-700 text-white font-bold py-2.5 px-6 rounded-lg transition duration-200">
          প্রোডাক্ট সেভ করুন
        </button>
      </form>
    </div>

    <!-- প্রোডাক্ট লিস্ট ও প্রাইস আপডেট -->
    <div class="bg-white p-6 rounded-xl shadow">
      <h2 class="text-lg font-bold text-gray-800 mb-4 border-b pb-2">বর্তমান প্রোডাক্ট তালিকা</h2>
      <div id="productList" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <p class="text-gray-500">লোড হচ্ছে...</p>
      </div>
    </div>

  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCswBk5Hrkzmb4c26DiDKYWzw168bo6Ijo",
      authDomain: "if-ibrahim.firebaseapp.com",
      databaseURL: "https://if-ibrahim-default-rtdb.firebaseio.com",
      projectId: "if-ibrahim",
      storageBucket: "if-ibrahim.firebasestorage.app",
      messagingSenderId: "233373846462",
      appId: "1:233373846462:web:86179f05bddd8356ca47ef"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const productsRef = db.ref('products');

    // প্রোডাক্ট যোগ করা
    document.getElementById('productForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const title = document.getElementById('title').value;
      const price = document.getElementById('price').value;
      const image = document.getElementById('image').value;
      const description = document.getElementById('description').value;

      const newProductRef = productsRef.push();
      newProductRef.set({
        title: title,
        price: price,
        image: image,
        description: description,
        createdAt: Date.now()
      }).then(() => {
        alert('প্রোডাক্ট সফলভাবে যোগ করা হয়েছে!');
        document.getElementById('productForm').reset();
      });
    });

    // ডাটাবেজ থেকে প্রোডাক্ট লোড ও এডিট
    productsRef.on('value', (snapshot) => {
      const productList = document.getElementById('productList');
      productList.innerHTML = '';
      const data = snapshot.val();

      if (!data) {
        productList.innerHTML = '<p class="text-gray-500">কোনো প্রোডাক্ট যোগ করা হয়নি।</p>';
        return;
      }

      Object.keys(data).forEach((id) => {
        const item = data[id];
        const card = document.createElement('div');
        card.className = "border rounded-lg p-3 flex gap-3 items-center bg-gray-50";
        card.innerHTML = `
          <img src="${item.image}" alt="${item.title}" class="w-16 h-16 object-cover rounded-md border" onerror="this.src='https://via.placeholder.com/100'">
          <div class="flex-1">
            <h3 class="font-bold text-gray-800 text-sm">${item.title}</h3>
            <p class="text-xs text-gray-500">${item.description || ''}</p>
            <div class="mt-2 flex items-center gap-2">
              <span class="text-xs font-semibold">দাম: ৳</span>
              <input type="number" id="price-${id}" value="${item.price}" class="w-20 p-1 text-sm border rounded bg-white font-bold text-pink-600">
              <button onclick="updatePrice('${id}')" class="text-xs bg-blue-600 text-white px-2 py-1 rounded hover:bg-blue-700">আপডেট</button>
            </div>
          </div>
          <button onclick="deleteProduct('${id}')" class="text-red-500 hover:text-red-700 p-2 text-sm font-bold">🗑️</button>
        `;
        productList.appendChild(card);
      });
    });

    // দাম আপডেট ফাংশন
    window.updatePrice = function(id) {
      const newPrice = document.getElementById(`price-${id}`).value;
      productsRef.child(id).update({ price: newPrice }).then(() => {
        alert('দাম সফলভাবে পরিবর্তন করা হয়েছে!');
      });
    };

    // ডিলিট ফাংশন
    window.deleteProduct = function(id) {
      if(confirm('আপনি কি নিশ্চিত এই প্রোডাক্টটি ডিলিট করতে চান?')) {
        productsRef.child(id).remove();
      }
    };
  </script>
</body>
</html>
