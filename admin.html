<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rupelia Admin - Secured Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800">

  <!-- ১. পাসওয়ার্ড লগইন মডাল -->
  <div id="loginScreen" class="fixed inset-0 bg-gray-900 bg-opacity-95 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl p-8 max-w-sm w-full text-center">
      <div class="w-16 h-16 bg-pink-100 text-pink-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
        <i class="fa-solid fa-lock"></i>
      </div>
      <h2 class="text-2xl font-bold text-gray-800 mb-1">অ্যাডমিন লগইন</h2>
      <p class="text-xs text-gray-500 mb-6">প্যানেলে প্রবেশ করতে সিকিউরিটি পাসওয়ার্ড দিন</p>
      
      <form id="loginForm" class="space-y-4">
        <div>
          <input 
            type="password" 
            id="adminPass" 
            placeholder="পাসওয়ার্ড লিখুন..." 
            required 
            class="w-full px-4 py-3 border rounded-xl focus:ring-2 focus:ring-pink-500 outline-none text-center text-lg tracking-widest"
          >
        </div>
        <p id="loginError" class="text-red-500 text-xs hidden font-medium">ভুল পাসওয়ার্ড! আবার চেষ্টা করুন।</p>
        <button 
          type="submit" 
          class="w-full bg-pink-600 hover:bg-pink-700 text-white font-bold py-3 rounded-xl transition duration-200 shadow-md shadow-pink-200"
        >
          লগইন করুন
        </button>
      </form>
    </div>
  </div>

  <!-- ২. মূল অ্যাডমিন ড্যাশবোর্ড -->
  <div id="adminDashboard" class="hidden max-w-4xl mx-auto p-4 md:p-8">
    
    <!-- হেডার বার -->
    <div class="flex justify-between items-center bg-white p-5 rounded-2xl shadow-sm mb-6 border">
      <div>
        <h1 class="text-2xl font-bold text-pink-600">RUPELIA Dashboard</h1>
        <p class="text-xs text-gray-500 mt-0.5">প্রোডাক্ট ম্যানেজমেন্ট ও প্রাইস আপডেট</p>
      </div>
      <div class="flex items-center gap-2">
        <a href="index.html" target="_blank" class="text-xs bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-2 rounded-lg font-semibold transition border">
          <i class="fa-solid fa-arrow-up-right-from-square mr-1"></i> শপ দেখুন
        </a>
        <button onclick="logout()" class="text-xs bg-red-50 hover:bg-red-100 text-red-600 px-3 py-2 rounded-lg font-semibold transition border border-red-200">
          <i class="fa-solid fa-right-from-bracket mr-1"></i> লগআউট
        </button>
      </div>
    </div>

    <!-- প্রোডাক্ট অ্যাড ফরম -->
    <div class="bg-white p-6 rounded-2xl shadow-sm border mb-8">
      <h2 class="text-lg font-bold text-gray-800 mb-4 border-b pb-3 flex items-center gap-2">
        <i class="fa-solid fa-plus-circle text-pink-600"></i> নতুন প্রোডাক্ট যুক্ত করুন
      </h2>
      <form id="productForm" class="space-y-4">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">প্রোডাক্টের নাম *</label>
            <input type="text" id="title" required placeholder="যেমন: রেশমি কাচের চুড়ি" class="w-full p-2.5 border rounded-xl focus:ring-2 focus:ring-pink-500 outline-none text-sm">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">মূল দাম (টাকা) *</label>
            <input type="number" id="price" required placeholder="যেমন: 450" class="w-full p-2.5 border rounded-xl focus:ring-2 focus:ring-pink-500 outline-none text-sm">
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">ডিসকাউন্ট (%) - অপশনাল</label>
            <input type="number" id="discount" placeholder="যেমন: 15" class="w-full p-2.5 border rounded-xl focus:ring-2 focus:ring-pink-500 outline-none text-sm">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">ছবির সরাসরি লিংক (URL) *</label>
            <input type="url" id="image" required placeholder="https://i.ibb.co/..." class="w-full p-2.5 border rounded-xl focus:ring-2 focus:ring-pink-500 outline-none text-sm">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">বিবরণ ও সাইজ *</label>
          <textarea id="description" required rows="2" placeholder="যেমন: প্রিমিয়াম কোয়ালিটি, সাইজ: 2.4, 2.6" class="w-full p-2.5 border rounded-xl focus:ring-2 focus:ring-pink-500 outline-none text-sm"></textarea>
        </div>

        <button type="submit" id="saveBtn" class="bg-pink-600 hover:bg-pink-700 text-white font-bold py-3 px-8 rounded-xl transition duration-200 shadow-md shadow-pink-200">
          প্রোডাক্ট সেভ করুন
        </button>
      </form>
    </div>

    <!-- বর্তমান প্রোডাক্ট তালিকা ও ম্যানেজমেন্ট -->
    <div class="bg-white p-6 rounded-2xl shadow-sm border">
      <h2 class="text-lg font-bold text-gray-800 mb-4 border-b pb-3 flex items-center gap-2">
        <i class="fa-solid fa-boxes-stacked text-pink-600"></i> বর্তমান প্রোডাক্ট তালিকা
      </h2>
      <div id="productList" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <p class="text-gray-400 text-sm">লোড হচ্ছে...</p>
      </div>
    </div>

  </div>

  <script>
    // --- Security Configuration ---
    const ADMIN_PASSWORD = "rupelia123"; // আপনার পাসওয়ার্ড

    // Session Check
    if (sessionStorage.getItem('rupelia_admin_auth') === 'true') {
      unlockDashboard();
    }

    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const enteredPass = document.getElementById('adminPass').value;
      if (enteredPass === ADMIN_PASSWORD) {
        sessionStorage.setItem('rupelia_admin_auth', 'true');
        unlockDashboard();
      } else {
        document.getElementById('loginError').classList.remove('hidden');
      }
    });

    function unlockDashboard() {
      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('adminDashboard').classList.remove('hidden');
    }

    function logout() {
      sessionStorage.removeItem('rupelia_admin_auth');
      location.reload();
    }

    // --- Firebase Configuration ---
    const firebaseConfig = {
      apiKey: "AIzaSyCswBk5Hrkzmb4c26DiDKYWzw168bo6Ijo",
      authDomain: "if-ibrahim.firebaseapp.com",
      databaseURL: "https://if-ibrahim-default-rtdb.firebaseio.com",
      projectId: "if-ibrahim",
      storageBucket: "if-ibrahim.firebasestorage.app",
      messagingSenderId: "233373846462",
      appId: "1:233373846462:web:86179f05bddd8356ca47ef"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const productsRef = db.ref('products');

    // প্রোডাক্ট যোগ করা
    document.getElementById('productForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const title = document.getElementById('title').value;
      const price = parseFloat(document.getElementById('price').value);
      const discount = parseInt(document.getElementById('discount').value || 0);
      const image = document.getElementById('image').value;
      const description = document.getElementById('description').value;

      const newProductRef = productsRef.push();
      newProductRef.set({
        title: title,
        price: price,
        discount: discount,
        image: image,
        description: description,
        createdAt: Date.now()
      }).then(() => {
        alert('প্রোডাক্ট সফলভাবে যুক্ত করা হয়েছে!');
        document.getElementById('productForm').reset();
      });
    });

    // প্রোডাক্ট রেন্ডার ও ডিলিট/ম্যানেজ
    productsRef.on('value', (snapshot) => {
      const productList = document.getElementById('productList');
      productList.innerHTML = '';
      const data = snapshot.val();

      if (!data) {
        productList.innerHTML = '<p class="text-gray-400 text-sm">কোনো প্রোডাক্ট যোগ করা হয়নি।</p>';
        return;
      }

      Object.keys(data).forEach((id) => {
        const item = data[id];
        const card = document.createElement('div');
        card.className = "border rounded-xl p-3 flex gap-3 items-center bg-gray-50 hover:bg-gray-100 transition";
        card.innerHTML = `
          <img src="${item.image}" alt="${item.title}" class="w-16 h-16 object-cover rounded-lg border bg-white" onerror="this.src='https://via.placeholder.com/100'">
          <div class="flex-1 min-w-0">
            <h3 class="font-bold text-gray-800 text-sm truncate">${item.title}</h3>
            <p class="text-xs text-gray-500 truncate">${item.description || ''}</p>
            <div class="mt-1 flex items-center gap-2">
              <span class="text-xs font-semibold text-pink-600">৳${item.price}</span>
              ${item.discount > 0 ? `<span class="text-[10px] bg-red-100 text-red-600 px-1.5 py-0.5 rounded font-bold">${item.discount}% OFF</span>` : ''}
            </div>
          </div>
          <button onclick="deleteProduct('${id}')" title="মুছে ফেলুন" class="text-red-500 hover:text-red-700 p-2 text-sm">
            <i class="fa-solid fa-trash-can"></i>
          </button>
        `;
        productList.appendChild(card);
      });
    });

    // প্রোডাক্ট ডিলিট ফাংশন
    window.deleteProduct = function(id) {
      if(confirm('আপনি কি নিশ্চিত যে এই প্রোডাক্টটি সম্পূর্ণ মুছে ফেলতে চান?')) {
        productsRef.child(id).remove();
      }
    };
  </script>
</body>
</html>
